<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Oumenia 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #ffdde1, #ee9ca7);
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      margin-top: 120px;
      font-size: 40px;
      color: #fff;
    }

    p {
      color: #fff;
      font-size: 20px;
      margin-top: 20px;
      padding: 0 20px;
    }

    .buttons {
      margin-top: 50px;
      position: relative;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      position: absolute;
      transition: 0.2s ease;
    }

    .yesBtn {
      background-color: #ff4d6d;
      color: white;
    }

    .noBtn {
      background-color: #444;
      color: white;
    }
  </style>
</head>
<body>

  <h1 id="question">Oumenia, do you love me? 💖</h1>

  <div class="buttons">
    <button id="yesBtn" class="yesBtn" style="left: 40%;">Yes 💘</button>
    <button id="noBtn" class="noBtn" style="left: 55%;">No 😅</button>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const question = document.getElementById("question");

    let noClickCount = 0;
    let yesClickCount = 0;

    // First question: No button
    noBtn.addEventListener("click", () => {
      noClickCount++;
      if (noClickCount === 1) {
        noBtn.textContent = "Think again 🤔";
      } else if (noClickCount === 2) {
        noBtn.textContent = "Are you sure? 😅";
      } else if (noClickCount === 3) {
        noBtn.textContent = "I know you love me, stop playing around 💖";
      }
    });

    // First question: Yes button
    yesBtn.addEventListener("click", () => {
      yesClickCount++;
      if (yesClickCount === 1) {
        yesBtn.textContent = "Really 💘";
      } else if (yesClickCount === 2) {
        yesBtn.textContent = "Really really 💘";
      } else if (yesClickCount === 3) {
        yesBtn.textContent = "Really really really 💘";
      } else if (yesClickCount === 4) {
        yesBtn.textContent = "I know you do 💘";

        // After final Yes click, transition to Valentine question
        setTimeout(() => {
          question.textContent = "Will you be my Valentine? 💖";
          yesBtn.textContent = "Yes 💘";
          noBtn.textContent = "No 😅";

          // Reset positions
          yesBtn.style.left = "40%";
          noBtn.style.left = "55%";
          noBtn.style.top = "0px";

          // Make "No" button move randomly
          function moveButton() {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
          }

          noBtn.addEventListener("mouseenter", moveButton);
          noBtn.addEventListener("click", moveButton);

          // Final Valentine Yes click
          yesBtn.onclick = () => {
            document.body.innerHTML = `
              <h1 style="margin-top:150px; color:white;">💖 Happy Anniversary, my love 💖</h1>
              <p>I've never been happier. Thank you for being a part of my life. I'm so glad I met you—you make the happiest (horniest, minor details, don't think about it) man on earth. I love you so much ❤️</p>
            `;
          };
        }, 300); // small delay for smooth transition
      }
    });
  </script>

</body>
</html>
