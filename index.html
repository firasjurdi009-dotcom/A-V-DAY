<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oumenia 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  text-align:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(270deg,#ff758c,#ff7eb3,#ffc3a0);
  background-size:600% 600%;
  animation:bg 20s ease infinite;
  transition:filter 2s ease, opacity 2s ease;
}

@keyframes bg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.dim{filter:brightness(0.6)}
.fade{opacity:0}

h1,p{
  color:white;
  text-shadow:0 0 20px rgba(255,255,255,.4);
  opacity:0;
  transform:translateY(25px);
  transition:.9s ease;
  padding:0 20px;
}

.show{opacity:1;transform:translateY(0)}

.buttons{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  margin-top:40px;
}

button{
  padding:16px 36px;
  font-size:18px;
  border:none;
  border-radius:24px;
  cursor:pointer;
  transition:.3s;
  min-width:240px;
}

button:hover{transform:scale(1.12)}

.yes{background:#ff4d6d;color:white}
.no{background:#333;color:white}

.option{
  background:white;
  margin:14px auto;
  padding:14px;
  border-radius:18px;
  max-width:320px;
  cursor:pointer;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.05)}
}

canvas{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
}

.save{
  margin-top:30px;
  background:white;
  color:#ff4d6d;
}
</style>
</head>

<body>

<h1 id="q"></h1>
<p id="sub"></p>

<div class="buttons" id="btns">
  <button id="yes" class="yes">Yes 💘</button>
  <button id="no" class="no">No 😅</button>
</div>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<canvas id="hearts"></canvas>

<script>
const q=document.getElementById("q");
const sub=document.getElementById("sub");
const yes=document.getElementById("yes");
const no=document.getElementById("no");
const btns=document.getElementById("btns");
const music=document.getElementById("music");

music.volume=0;

function fadeMusic(to){
  const i=setInterval(()=>{
    music.volume=Math.min(1,Math.max(0,music.volume+(to?0.02:-0.02)));
    if(music.volume===to)clearInterval(i);
  },120);
}

document.body.addEventListener("click",()=>{
  music.play();
  fadeMusic(0.6);
},{once:true});

function show(el){
  el.classList.remove("show");
  setTimeout(()=>el.classList.add("show"),50);
}

function transition(next){
  document.body.classList.add("dim");
  setTimeout(()=>{
    document.body.classList.remove("dim");
    next();
  },2000);
}

let y=0,n=0;
q.textContent="Oumenia, do you love me? 💖";
show(q);

yes.onclick=()=>{
  y++;
  const t=["Really 💘","Really really 💘","Really really really 💘","I know you do 💖"];
  if(y<=4)yes.textContent=t[y-1];
  if(y===4)setTimeout(()=>transition(loveAmount),5500);
};

no.onclick=()=>{
  n++;
  const t=["Think again 🤔","Are you sure? 😅","I know you love me stop playing around 💖"];
  if(n<=3)no.textContent=t[n-1];
};

function loveAmount(){
  q.textContent="How much do you love me? 🥺";
  show(q);
  btns.innerHTML="";
  ["Burj Khalifa","The Ocean","The World","Space","The Entire Galaxy"].forEach(t=>{
    const d=document.createElement("div");
    d.className="option";
    d.textContent=t;
    d.onclick=()=>{
      q.textContent="You don’t love me anymore 😢";
      show(q);
      setTimeout(()=>transition(valentine),5500);
    };
    btns.appendChild(d);
  });
}

function valentine(){
  btns.innerHTML="";
  btns.appendChild(yes);btns.appendChild(no);
  yes.textContent="Yes 💘";no.textContent="No 😅";
  q.textContent="Will you be my Valentine? 💖";
  show(q);
  let c=0;
  yes.onclick=()=>{
    c++;
    const t=["You sure? 😏","100% sure? 😏","Okay say yes 😌","YES 💘"];
    yes.textContent=t[Math.min(c-1,3)];
    if(c>=4)setTimeout(()=>transition(finale),5500);
  };
  no.onmouseenter=()=>{
    no.style.transform=`translateX(${Math.random()*40-20}px)`;
  };
}

function finale(){
  fadeMusic(1);
  btns.innerHTML="";
  q.textContent="💖 Happy Anniversary My Love 💖";
  show(q);
  sub.textContent=
  "I’ve never been happier. Thank you for being part of my life. I’m so glad I met you — you make the happiest (horniest, minor details 😏) man on earth. I love you so much ❤️";
  show(sub);
  hearts();
  const save=document.createElement("button");
  save.textContent="💌 Save this moment";
  save.className="save";
  save.onclick=()=>alert("Screenshot this moment 💖");
  btns.appendChild(save);
}

function hearts(){
  const c=document.getElementById("hearts");
  const x=c.getContext("2d");
  c.width=innerWidth;c.height=innerHeight;
  let p=[];
  setInterval(()=>{
    for(let i=0;i<6;i++){
      p.push({x:Math.random()*c.width,y:c.height+20,a:1,s:Math.random()*18+10});
    }
  },500);
  function anim(){
    x.clearRect(0,0,c.width,c.height);
    p.forEach((e,i)=>{
      e.y-=1.2;e.a-=0.002;
      x.fillStyle=`rgba(255,90,140,${e.a})`;
      x.font=e.s+"px Arial";
      x.fillText("💖",e.x,e.y);
      if(e.a<=0)p.splice(i,1);
    });
    requestAnimationFrame(anim);
  }
  anim();
}
</script>

</body>
</html>
