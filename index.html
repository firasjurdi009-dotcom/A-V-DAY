<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oumenia 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  text-align:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(-45deg,#2b0f2f,#4a0e4e,#1a0826,#3b0a40);
  background-size:400% 400%;
  animation:bgMove 18s ease infinite;
  transition:filter 2s ease, opacity 2s ease;
}

@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.dim{filter:brightness(0.6)}

h1,p{
  color:white;
  text-shadow:0 0 18px rgba(255,255,255,.4);
  opacity:0;
  transform:translateY(25px);
  transition:.9s ease;
  padding:0 20px;
}

.show{opacity:1;transform:translateY(0)}

.buttons{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  margin-top:40px;
  z-index:2;
  position:relative;
}

button{
  padding:16px 36px;
  font-size:18px;
  border:none;
  border-radius:24px;
  cursor:pointer;
  transition:.3s;
  min-width:240px;
}

button:hover, button:active{transform:scale(1.12)}

.yes{background:#ff4d6d;color:white}
.no{background:#333;color:white}

.option{
  background:white;
  margin:14px auto;
  padding:14px;
  border-radius:18px;
  max-width:320px;
  cursor:pointer;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.05)}
}

canvas{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
}
</style>
</head>

<body>

<h1 id="q"></h1>
<p id="sub"></p>

<div class="buttons" id="btns">
  <button id="yes" class="yes">Yes 💘</button>
  <button id="no" class="no">No 😅</button>
</div>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>


<canvas id="bgCanvas"></canvas>
<canvas id="hearts"></canvas>

<script>
const q=document.getElementById("q");
const sub=document.getElementById("sub");
const yes=document.getElementById("yes");
const no=document.getElementById("no");
const btns=document.getElementById("btns");
const bgMusic=document.getElementById("bgMusic");

// Play music on first tap/click (mobile-friendly)
function fadeInMusic(){
  if(bgMusic.paused){
    bgMusic.volume=0;
    bgMusic.play().catch(()=>{}); 
    let vol=0;
    const fade=setInterval(()=>{
      vol+=0.02;
      if(vol>=1){ vol=1; clearInterval(fade); }
      bgMusic.volume=vol;
    },100);
  }
}
document.body.addEventListener("click", fadeInMusic, { once:true });
document.body.addEventListener("touchstart", fadeInMusic, { once:true });

function show(el){
  el.classList.remove("show");
  setTimeout(()=>el.classList.add("show"),50);
}

function transition(next){
  document.body.classList.add("dim");
  setTimeout(()=>{
    document.body.classList.remove("dim");
    next();
  },500);
}

/* QUESTION 1 */
let y=0,n=0;
q.textContent="Oumenia, do you love me? 💖";
show(q);

yes.onclick=()=>{
  y++;
  const t=["Really 💘","Really really 💘","Really really really 💘","I know you do 💖"];
  if(y<=4) yes.textContent=t[y-1];
  if(y===4) setTimeout(()=>transition(loveAmount),500);
};

no.onclick=()=>{
  n++;
  const t=["Think again 🤔","Are you sure? 😅","I know you love me stop playing around 💖"];
  if(n<=3) no.textContent=t[n-1];
};

/* LOVE AMOUNT */
function loveAmount(){
  q.textContent="How much do you love me? 🥺";
  show(q);
  btns.innerHTML="";
  ["Burj Khalifa","The Ocean","The World","Space","The Entire Galaxy"].forEach(t=>{
    const d=document.createElement("div");
    d.className="option";
    d.textContent=t;
    d.onclick=()=>{
      q.textContent="You don’t love me anymore 😢";
      show(q);
      setTimeout(()=>transition(valentine),500);
    };
    btns.appendChild(d);
  });
}

/* VALENTINE */
function valentine(){
  btns.innerHTML="";
  btns.appendChild(yes);
  btns.appendChild(no);
  yes.textContent="Yes 💘";
  no.textContent="No 😅";
  q.textContent="Will you be my Valentine? 💖";
  show(q);

  let c=0;
  yes.onclick=()=>{
    c++;
    const t=["You sure? 😏","100% sure? 😏","Okay say yes 😌","YES 💘"];
    yes.textContent=t[Math.min(c-1,3)];
    if(c>=4){
      setTimeout(()=>transition(finale),500);
    }
  };

  const moveNo=()=>{
    no.style.transform=`translateX(${Math.random()*60-30}px) translateY(${Math.random()*20-10}px)`;
  };
  no.onmouseenter=moveNo;
  no.addEventListener("touchstart", moveNo);
}

/* FINAL ANNIVERSARY PAGE */
function finale(){
  fadeInMusic();
  btns.innerHTML="";
  q.textContent="💖 Happy Anniversary My Love 💖";
  show(q);
  sub.textContent="I’ve never been happier. Thank you for being part of my life. I’m so glad I met you — you make the happiest (horniest, minor details 😏) man on earth. I love you so much ❤️";
  show(sub);
  hearts();

  setTimeout(congratulationsPage,10000);
}

/* FINAL CONGRATULATIONS PAGE */
function congratulationsPage(){
  btns.innerHTML="";
  q.textContent="🎉 Congratulations! 🎉";
  sub.textContent="You are now mine forever ❤️";
  show(q);
  show(sub);
  hearts();
}

/* HEARTS */
function hearts(){
  const c=document.getElementById("hearts");
  const x=c.getContext("2d");
  function resizeHearts(){ c.width=window.innerWidth; c.height=window.innerHeight; }
  resizeHearts();
  window.addEventListener("resize", resizeHearts);

  let p=[];
  setInterval(()=>{
    let count = window.innerWidth<600? 3:6;
    for(let i=0;i<count;i++){
      p.push({x:Math.random()*c.width,y:c.height+20,a:1,s:Math.random()*(c.width/40)+10});
    }
  },500);

  function anim(){
    x.clearRect(0,0,c.width,c.height);
    p.forEach((e,i)=>{
      e.y-=1.2;
      e.a-=0.002;
      x.fillStyle=`rgba(255,90,140,${e.a})`;
      x.font=e.s+"px Arial";
      x.fillText("💖",e.x,e.y);
      if(e.a<=0) p.splice(i,1);
    });
    requestAnimationFrame(anim);
  }
  anim();
}

/* BACKGROUND PARTICLES */
const bgCanvas=document.getElementById("bgCanvas");
const bgCtx=bgCanvas.getContext("2d");
function resizeBG(){ bgCanvas.width=window.innerWidth; bgCanvas.height=window.innerHeight; }
resizeBG();
window.addEventListener("resize", resizeBG);

let particleCount=window.innerWidth<600?40:80;
let particles=[];
for(let i=0;i<particleCount;i++){
  particles.push({x:Math.random()*bgCanvas.width,y:Math.random()*bgCanvas.height,r:Math.random()*(window.innerWidth/300)+1,d:Math.random()*1});
}

function animateBG(){
  bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
  bgCtx.fillStyle="rgba(255,255,255,0.05)";
  bgCtx.beginPath();
  particles.forEach(p=>{
    bgCtx.moveTo(p.x,p.y);
    bgCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
  });
  bgCtx.fill();
  particles.forEach(p=>{
    p.y-=p.d;
    if(p.y<0){p.y=bgCanvas.height;p.x=Math.random()*bgCanvas.width;}
  });
  requestAnimationFrame(animateBG);
}
animateBG();
</script>

</body>
</html>
